<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inter Kids</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>

<body>
  <main class="page-shell">
    <nav class="navbar" aria-label="Navegação principal">
      <a class="brand" href="#" aria-label="Inter Kids">
        <img src="assets/brand/logo.svg" alt="Inter Kids" />
      </a>

      <div class="nav-items" aria-label="Destaques do Inter Kids">
        <div class="nav-item">
          <img src="assets/icons/cell.svg" alt="" aria-hidden="true" />
          <span>App Inter Kids</span>
        </div>
        <div class="nav-item">
          <img src="assets/icons/shield.svg" alt="" aria-hidden="true" />
          <span>100% seguro</span>
        </div>
        <div class="nav-item">
          <img src="assets/icons/smile.svg" alt="" aria-hidden="true" />
          <span>Feito para crianças</span>
        </div>
      </div>
    </nav>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <div class="hero-text">
          <h1 id="hero-title">Banco digital<br />para <span>crianças</span></h1>
          <p>Com o Inter Kids, aprender a guardar dinheiro fica leve, divertido e cheio de metas.</p>
        </div>

        <div class="actions" aria-label="Ações principais">
          <a class="button button-primary" href="#">Abrir conta grátis</a>
          <a class="button button-secondary" href="#">
            <img src="assets/brand/logo-small.svg" alt="" aria-hidden="true" />
            <span>Conhecer o Inter Kids</span>
          </a>
        </div>
      </div>

      <ul class="benefits" aria-label="Benefícios">
        <li>
          <span class="benefit-icon"><img src="assets/icons/money-security.svg" alt="" aria-hidden="true" /></span>
          <span>Diversão com segurança</span>
        </li>
        <li>
          <span class="benefit-icon"><img src="assets/icons/money-book.svg" alt="" aria-hidden="true" /></span>
          <span>Educação financeira</span>
        </li>
        <li>
          <span class="benefit-icon"><img src="assets/icons/target.svg" alt="" aria-hidden="true" /></span>
          <span>Cofrinhos e metas</span>
        </li>
      </ul>

      <div class="hero-art" aria-hidden="true">
        <img src="assets/images/hero-image.webp" alt="" />
      </div>
    </section>
  </main>
</body>

</html>
